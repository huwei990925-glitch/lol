name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and setup Capacitor iOS
        run: |
          npm install
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Payload and generate IPA
        run: |
          APP_PATH=$(find ios/App/build -name "*.app" -type d | grep Release-iphoneos | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          fi
          echo "Found compiled iOS App at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "LOL推演.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOL推演_Sideloadly专用
          path: LOL推演.ipa
